<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fafbfc" />
    <meta name="description" content="InStep — платформа онлайн-курсов и практик для тела, ума и самореализации. Тренеры ведут учеников по программам с видео, аудио и живыми звонками, ученики фиксируют прогресс по дням." />
    <meta name="author" content="InStep" />
    <meta name="robots" content="index, follow" />

    <!-- PWA: installable on Android Chrome + iOS Safari "Add to Home Screen" -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS standalone: hides Safari UI when launched from homescreen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="InStep" />
    <meta name="application-name" content="InStep" />

    <!-- Open Graph / Twitter — «сигналы легитимности» для антифишинга,
         соцшейров и превью в мессенджерах. og:url и canonical проставляются
         в runtime в самом низу <body>, чтобы автоматически соответствовать
         текущему домену (.life сейчас, .expert после переезда). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InStep" />
    <meta property="og:title" content="InStep — платформа курсов и практик" />
    <meta property="og:description" content="Онлайн-платформа для тренеров и учеников: курсы, ежедневные практики, живые созвоны, отслеживание прогресса." />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="InStep — платформа курсов и практик" />
    <meta name="twitter:description" content="Онлайн-платформа для тренеров и учеников: курсы, ежедневные практики, живые созвоны, отслеживание прогресса." />
    <meta name="twitter:image" content="/apple-touch-icon.png" />

    <title>InStep — курсы и практики</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Проставляем og:url + canonical по текущему origin — чтобы не хардкодить
      // домен в HTML и корректно работало и на instep.life, и на instep.expert.
      try {
        var origin = window.location.origin;
        var ogUrl = document.createElement('meta');
        ogUrl.setAttribute('property', 'og:url');
        ogUrl.setAttribute('content', origin + '/');
        document.head.appendChild(ogUrl);
        var canon = document.createElement('link');
        canon.setAttribute('rel', 'canonical');
        canon.setAttribute('href', origin + '/');
        document.head.appendChild(canon);
      } catch (e) {}

      // Register service worker for PWA installability. Failure is non-fatal —
      // the app keeps working as a normal web page; just no homescreen install.
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((e) => {
            console.warn('[InStep] SW registration failed:', e);
          });
        });
      }
    </script>
  </body>
</html>
