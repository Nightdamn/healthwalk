# InStep — Nginx config
# Место: /etc/nginx/sites-available/instep
# Симлинк: ln -s /etc/nginx/sites-available/instep /etc/nginx/sites-enabled/
#
# SSL-сертификат через certbot:
#   certbot --nginx -d instep.life -d www.instep.life

upstream instep_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name instep.life www.instep.life;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://instep.life$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name instep.life www.instep.life;

    # SSL — certbot заполнит автоматически
    ssl_certificate /etc/letsencrypt/live/instep.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/instep.life/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Redirect www → apex
    if ($host = www.instep.life) {
        return 301 https://instep.life$request_uri;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Body size (для загрузки видео — до 1 ГБ + overhead на multipart)
    client_max_body_size 1100M;

    # Static assets (кэш 1 год — Vite добавляет хеш в имена)
    location /assets/ {
        alias /opt/instep/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon, manifest, robots
    location ~* \.(ico|png|svg|webmanifest|robots\.txt)$ {
        root /opt/instep/dist;
        expires 7d;
        access_log off;
    }

    # API — proxy to Node.js
    location /api/ {
        proxy_pass http://instep_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket support
    location /ws/ {
        proxy_pass http://instep_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — всё остальное через Node.js
    location / {
        proxy_pass http://instep_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
